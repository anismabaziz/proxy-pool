[project]
name = "proxy-pool"
version = "0.1.0"
description = "Scrape public proxy lists, probe what comes back, and keep the pool honest."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anis Mabaziz" }]
keywords = [
    "proxy",
    "proxy-pool",
    "asyncio",
    "aiohttp",
    "http",
    "scraping",
    "networking",
]
dependencies = [
    "aiohttp>=3.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# The formatter owns line length, so the linter stays out of its way.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
